# Fast profile: mesh + point cloud within the problem statement's budget
# (< 15 minutes for a 10-minute video) on one GPU.
#
#   uv run drone3d run --config configs/fast.yaml --set ingest.video=/data/pass.mp4 \
#       [--set ingest.telemetry=/data/pass.SRT]
#   uv run drone3d view outputs/fast
#
# Keyframes by overlap as in the default profile, written at 1920 px; SfM from
# RAFT flow tracks (no SIFT); dense depth from flow triangulation, completed by
# Depth Anything V2 calibrated to it; GPU TSDF mesh and point cloud; exports in
# OBJ, PLY, GLB, FBX, LAS and GeoTIFF; web viewer. No splat training.

run_name: fast
stages: [ingest, keyframes, sfm, dense, georef, export, metrics, report]
keyframes:
  output_long_side: 1920
sfm:
  backend: flow
  mapper: global
dense:
  backend: flow
  long_side: 480
  mono_model: depth-anything/Depth-Anything-V2-Large-hf
