<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drone3d viewer</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b1118; --panel: #0e151cdd; --line: #26364a; --text: #e7edf3; --muted: #8b9bac; --saffron: #ff9f1c; --cyan: #4fd1e8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "IBM Plex Sans", system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: min(300px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto;
           background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  h1 { font: 800 20px/1 "Big Shoulders Display", "Arial Narrow", sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 3px; }
  h1 b { color: var(--saffron); }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  h2 { font: 700 11px/1 "Big Shoulders Display", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
  .lay { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  button, select { background: #16212d; color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; cursor: pointer; font: inherit; }
  button.on { border-color: var(--saffron); color: var(--saffron); }
  select { width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; } .row > * { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; } td { padding: 2px 0; } td:last-child { text-align: right; color: var(--muted); }
  a { color: var(--cyan); } #files a { display: inline-block; margin: 2px 8px 2px 0; font-size: 12px; }
  #hud { position: fixed; right: 12px; bottom: 12px; font: 11px ui-monospace, monospace; color: var(--muted); background: #0b1118cc; padding: 4px 8px; border-radius: 6px; }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 12px; background: #0b1118cc; padding: 4px 10px; border-radius: 6px; }
  #status { color: var(--saffron); font-size: 12px; margin-top: 6px; }
  #measures div { font: 12px ui-monospace, monospace; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>drone<b>3d</b></h1>
  <div class="sub" id="subtitle">loading…</div>
  <select id="pick"></select>
  <h2>Layers</h2><div class="lay" id="layers"></div>
  <h2>Navigate</h2><div class="row"><button data-nav="orbit" class="on">Orbit</button><button data-nav="fly">Fly</button><button data-nav="follow">Follow flight</button></div>
  <h2>Render</h2><div class="row"><button data-rs="0.5">0.5×</button><button data-rs="1" class="on">1×</button><button data-rs="1.5">1.5×</button><button data-rs="2">2×</button></div>
  <div class="row" style="margin-top:6px"><span class="sub" style="margin:0;flex:none">points</span><input id="pSize" type="range" min="0.5" max="6" step="0.5" value="1.5"></div>
  <h2>Measure</h2><div class="row"><button id="tMeasure">Measure</button><button id="tShot">Screenshot</button></div><div id="measures"></div>
  <h2>Model</h2><table id="stats"></table>
  <h2>Downloads</h2><div id="files"></div>
  <div id="status"></div>
</div>
<div id="hint">orbit: drag · right-drag pan · wheel zoom · fly: W A S D Q E, drag to look</div>
<div id="hud"></div>
<script type="module">
import { Explorer } from './explorer.js';
const $ = (id) => document.getElementById(id);
const x = new Explorer($('view'));
x.addEventListener('status', (e) => { $('status').textContent = e.detail; });
x.addEventListener('tick', () => { const s = x.stats(); $('hud').textContent = `${s.fps} fps · ${s.triangles.toLocaleString()} tris · ${s.splats.toLocaleString()} splats`; });
const scn = await (await fetch('scene.json')).json();
const all = scn.models || [scn];
const pick = Math.min(all.length - 1, Math.max(0, +(new URLSearchParams(location.search).get('m') || 0)));
const cfg = all[pick];
$('pick').innerHTML = all.map((m, i) => `<option value="${i}" ${i === pick ? 'selected' : ''}>${m.name}</option>`).join('');
$('pick').onchange = (e) => { location.search = '?m=' + e.target.value; };
$('subtitle').textContent = `${scn.title || ''} · ${cfg.georeferenced ? 'georeferenced, metres' : 'levelled, SfM units'}`;
$('stats').innerHTML = Object.entries(cfg.stats || {}).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
$('files').innerHTML = (cfg.files || []).map((f) => `<a href="${f.path}" download>${f.label}</a>`).join('') || '—';
await x.setScene([cfg]);
const LAYERS = [['mesh', 'Mesh'], ['texture', 'Texture'], ['shaded', 'Shaded'], ['wireframe', 'Wire'], ['points', 'Points'], ['splats', 'Splats'], ['cameras', 'Flight path'], ['photos', 'Photos'], ['depth', 'Depth'], ['grid', 'Grid']];
const drawLayers = () => { $('layers').innerHTML = LAYERS.filter(([k]) => x.layerAvailable(k)).map(([k, t]) => `<button data-l="${k}" class="${x.layers[k] ? 'on' : ''}">${t}</button>`).join('');
  $('layers').querySelectorAll('button').forEach((b) => (b.onclick = async () => { await x.setLayer(b.dataset.l, !x.layers[b.dataset.l]); drawLayers(); })); };
drawLayers();
const navBtns = document.querySelectorAll('[data-nav]');
const setNav = (m) => navBtns.forEach((b) => b.classList.toggle('on', b.dataset.nav === m));
navBtns.forEach((b) => (b.onclick = () => { b.dataset.nav === 'follow' ? x.followFlight(true) : x.setNavigation(b.dataset.nav); setNav(b.dataset.nav); x.renderer.domElement.focus(); }));
x.addEventListener('followend', () => setNav('fly'));
document.querySelectorAll('[data-rs]').forEach((b) => (b.onclick = () => { x.setRenderScale(+b.dataset.rs); document.querySelectorAll('[data-rs]').forEach((c) => c.classList.toggle('on', c === b)); }));
$('pSize').oninput = (e) => x.setPointSize(+e.target.value);
$('tMeasure').onclick = () => { x.setMeasuring(!x.measuring); $('tMeasure').classList.toggle('on', x.measuring); };
x.addEventListener('measure', () => { $('measures').innerHTML = x.measures.map((m, i) => `<div>#${i + 1} ${m.d.toFixed(2)} ${m.units} · Δh ${m.dz.toFixed(2)}</div>`).join(''); });
$('tShot').onclick = async () => { const b = await x.screenshot(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'drone3d.png'; a.click(); };
</script>
</body>
</html>
