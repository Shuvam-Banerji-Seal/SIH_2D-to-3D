[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "drone3d"
version = "0.1.0"
description = "Single-pass drone video to accurate, georeferenced 3D models (SIH PS 26158 / NTRO)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-2.0-only" }
authors = [
  { name = "Team SIH_2D-to-3D" },
]
keywords = [
  "drone",
  "photogrammetry",
  "3d-reconstruction",
  "structure-from-motion",
  "georeferencing",
  "uav",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU keyframe selection, NVML telemetry, splat rendering.
gpu = [
  "torch>=2.14",
  "torchvision>=0.29",
  "nvidia-ml-py>=13.0",
]
# Marigold v2 monocular depth (third_party/marigold-v2 is imported from source).
depth = [
  "torch>=2.14",
  "diffusers>=0.40",
  "transformers>=5.4",
  "accelerate>=1.13",
  "peft>=0.18",
  "safetensors>=0.8",
  "bitsandbytes>=0.50",
  "omegaconf>=2.3",
  "scipy>=1.15",
  "scikit-image>=0.25",
  "matplotlib>=3.10",
  "pillow>=12.0",
]
sfm = ["pycolmap>=4.2"]
mesh = ["open3d>=0.20", "trimesh>=5.0", "plyfile>=1.1"]
geo = ["pyproj>=3.7", "laspy>=2.5"]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/Shuvam-Banerji-Seal/SIH_2D-to-3D"
Repository = "https://github.com/Shuvam-Banerji-Seal/SIH_2D-to-3D"
Issues = "https://github.com/Shuvam-Banerji-Seal/SIH_2D-to-3D/issues"

[project.scripts]
drone3d = "drone3d.cli:main"

# ---------------------------------------------------------------------------
# uv: development dependencies (PEP 735 dependency groups).
# `uv sync` installs the `dev` group by default; use `uv sync --all-extras`
# to pull in every optional reconstruction backend.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[tool.uv]
package = true
default-groups = ["dev"]
# Keep resolution reproducible across machines/CI.
resolution = "highest"

# Newest PyTorch CUDA build with cp314 wheels; CUDA 13.2 runs on the 13.3 driver.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.hatch.build.targets.wheel]
packages = ["src/drone3d"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/configs",
  "/docs",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that need heavy optional backends or real datasets",
  "gpu: tests that need a CUDA-capable device",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"
# `.tools/` holds external tooling (e.g. a conda env with the COLMAP binary);
# it is vendored third-party code and must not be linted or formatted.
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src/drone3d"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
