# Fast profile: mesh + point cloud within the problem statement's budget
# (< 15 minutes for a 10-minute video) on one GPU.
#
#   uv run drone3d run --config configs/fast.yaml --set ingest.video=/data/pass.mp4 \
#       [--set ingest.telemetry=/data/pass.SRT]
#   uv run drone3d view outputs/fast
#
# Keyframes by overlap as in the default profile, written at 1920 px; SfM from
# RAFT flow tracks (no SIFT); dense depth from flow triangulation, completed by
# Depth Anything V2 calibrated to it; GPU TSDF mesh and point cloud; exports in
# OBJ, PLY, GLB, FBX, LAS and GeoTIFF; web viewer. No splat training unless the splat
# stage is added (the console's module switch); then at the settings below.

run_name: fast
stages: [ingest, keyframes, sfm, dense, georef, export, metrics, report]
keyframes:
  output_long_side: 1920
  # View completeness (exact, ray cast) vs processing time (A100, warm engine):
  #                         Jal Mahal 55 s (budget 82)   Qutub Minar 187 s (budget 281)
  #   absolute, 12 fps      0.82 / 262 s                 0.81 / 307 s
  #   absolute, adaptive    0.78 / 147 s  (3.0 fps)      0.75 / 243 s  (3.3 fps)
  #   relative, adaptive    0.71 / 145 s  (6.0 fps)      0.70 / 292 s  (7.5 fps)
  # Absolute overlap with the adaptive rate is at least as fast and more complete.
  adaptive_rate: true
  min_analysis_fps: 3.0
sfm:
  backend: flow
  mapper: global
dense:
  backend: flow
  long_side: 480
  mono_model: depth-anything/Depth-Anything-V2-Large-hf
  keyframe_stride: 2  # depth references: every 2nd keyframe on passes of 40+ keyframes
# When the splat stage is switched on: medium quality, 7000 steps from the dense cloud (the benchmark's settings,
# ~1 M splats a model, 1-2 min each on the A100). The library default (high, 30k steps) grew Mont Saint-Michel's
# fog-bound models to 3 M splats and took 1 h 48 min on a shared GPU.
splat:
  models: all
  quality: medium
  iterations: 7000
  depth_weight: 0
  parallel: 1
