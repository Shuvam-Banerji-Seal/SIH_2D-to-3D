name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Import smoke test
        run: uv run python -c "import drone3d, drone3d.pipeline, drone3d.cli; print(drone3d.__version__)"

      - name: CLI smoke test
        run: uv run drone3d doctor

      - name: Unit tests
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            uv run pytest --cov=drone3d --cov-report=term-missing
          else
            echo "No tests yet - add them under tests/ (see docs/roadmap.md)."
          fi

  configs:
    name: Validate shipped configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Load every config
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from drone3d.config import load_config

          for path in sorted(Path("configs").glob("*.yaml")):
              config = load_config(path)
              print(f"{path}: ok ({len(config.stages)} stages)")
          PY
