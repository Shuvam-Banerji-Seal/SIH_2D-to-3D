# Default profile: the full Gaussian-splatting pipeline -- SIFT structure from motion,
# Marigold v2 depth priors, 3D Gaussian Splatting and a mesh from the splats. Every key
# optional; these are the built-in defaults. Hours per clip, not the time budget.
#
#   uv run drone3d run --config configs/default.yaml --set ingest.video=/data/pass.mp4
#
# Override any key from the CLI with --set section.key=value.

run_name: run
output_root: outputs
stages: [ingest, keyframes, sfm, depth, splat, mesh, georef, render, metrics, report]
log_level: INFO

ingest:
  video: null            # single-pass drone video (any codec ffmpeg reads; NVDEC when available)
  telemetry: null        # .csv | .srt (DJI) | .gpx | .json flight log for georeferencing

keyframes:               # GPU pass segmentation + overlap-band selection + 3D verdict
  analysis_long_side: 640
  analysis_fps: 12.0
  flow_model: raft_large # raft_large | raft_small
  flow_batch: 32
  overlap_target: 0.75   # tau: each keyframe keeps >= 75 % co-visibility with the previous one
  overlap_band: 0.10     # candidates in [tau, tau + delta]; ~1 / (1 - tau) views per point
  max_gap_s: 2.0
  min_pass_s: 2.0
  cut_consistency: 0.35  # flow consistency below this between neighbours = a cut
  hfov_deg: 72.0
  parallax_snr: 2.0      # residual parallax must be 2x what flow noise alone leaves
  output_long_side: null # null keeps the source resolution for the keyframe images
  jpeg_quality: 95
  passes: []             # restrict to these pass ids (empty = all)
  skip_degenerate: true
  hwaccel: true

sfm:                     # spirula-studio GPU SfM
  backend: spirula
  quality: high
  camera_model: radial   # one focal length: drone cameras have square pixels
  camera_mode: folder    # one camera per pass (edited footage may re-crop between shots)
  features: sift
  extra_args: []

depth:                   # Marigold v2 monocular depth, aligned to SfM
  backend: marigold
  checkpoint: depth/Log-stage2
  long_side: 1024
  batch: 4
  quantization: 4bit
  far_factor: 3.0
  out_long_side: 1920

splat:                   # spirula-studio 3D Gaussian Splatting
  backend: spirula
  preset: 3dgs
  iterations: 30000
  quality: high
  resolution_divisor: 2
  depth_weight: 0.05
  eval_interval: 8       # every 8th keyframe is held out for evaluation
  models: all
  min_model_images: 8
  flags: {}

mesh:
  backend: spirula
  formats: [ply, glb, obj]
  colors: [vertex, texture]

geo:
  enabled: true
  origin_lat: null
  origin_lon: null
  origin_alt: 0.0
  align_mode: auto       # auto | similarity | yaw-scale | translation
  min_correspondences: 3
  write_geojson: true

render:
  enabled: true
  seconds: 12.0
  fps: 30
  long_side: 1920

metrics:
  voxel_size: 0.5
  reference_cloud: null
  report_thumbnails: 12
  gpu_telemetry: true
