# Fast preview: minutes, not tens of minutes, on one GPU.
#
#   uv run drone3d run --config configs/fast.yaml --set ingest.video=/data/pass.mp4
#
# Fewer keyframes (lower overlap target), the small flow model, no monocular
# depth prior, short training at 1/2 resolution, vertex-coloured mesh only.

run_name: fast
keyframes:
  flow_model: raft_small
  analysis_fps: 8.0
  overlap_target: 0.65
  output_long_side: 1920
sfm:
  quality: medium
depth:
  backend: none
splat:
  iterations: 7000
  quality: medium
  models: largest
mesh:
  formats: [glb]
  colors: [vertex]
render:
  seconds: 8.0
